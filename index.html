<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="src/Style/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>
    
    <div class="container">

        <div class="card">

            <div class="img-card">
                <img src="src/image/image 2 (1).png" alt="Profile Picture">
            </div>

            <div class="desc">
                <h2>Sophie Bennett <i class="ri-checkbox-circle-fill"></i></h2>
                <p>Web Developer</p>
                <p>Passionate about creating beautiful and functional web applications.</p>
            </div>

            <div class="info">
                <div class="info-item">
                    <i class="ri-user-line"></i>
                    <p>312</p>
                </div>
                <div class="info-item">
                    <i class="ri-heart-line"></i>
                    <p>48</p>
                </div>
                <div class="btn">
                    <button class="follow-btn">Follow <i class="ri-add-line"></i></button>
                </div>
            </div>

        </div>


        <div class="card">

            <div class="img-card-2" style="background-image: url('src/image/image 2.png'); background-size: cover; background-position: center;">

                <div class="blank">
                    <div class="block"></div>
                </div>
                <div class="card-container">
                    <div class="desc-2">
                        <h2>Sophie Bennett <i class="ri-checkbox-circle-fill"></i></h2>
                        <p>Web Developer</p>
                        <p>Passionate about creating beautiful and functional web applications.</p>
                    </div>

                    <div class="info">
                        <div class="info-item-2">
                            <i class="ri-user-line"></i>
                            <p>312</p>
                        </div>
                        <div class="info-item-2">
                            <i class="ri-heart-line"></i>
                            <p>48</p>
                        </div>
                        <div class="btn">
                            <button class="follow-btn-2">Follow <i class="ri-add-line"></i></button>
                        </div>
                    </div>
                </div>
                
            </div>

            

        </div>

    </div>

</body>
</html>
